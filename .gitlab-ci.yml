
variables:
  DS_ENFORCE_NEW_ANALYZER: 'true'
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

sast:
  stage: test
  artifacts:
    name: sast
    paths:
      - gl-sast-report.json
    reports:
      sast: gl-sast-report.json
    when: always

secret_detection:
  stage: test

generate-dependency-graph:
  stage: build
  image: python:3.13-slim
  script:
    - python -m pip install -r requirements.txt pipdeptree
    - pipdeptree --exclude pipdeptree --json > pipdeptree.json
  artifacts:
    paths:
      - pipdeptree.json

stages:
  - build
  - test
